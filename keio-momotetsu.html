<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>リアル京王線桃鉄</title>
  <style>
    :root {
      --keio-pink: #DD0077;
      --keio-blue: #002A86;
      --bg-color: #F4F6F9;
      --card-bg: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: #333;
      padding: 12px;
      padding-top: max(12px, env(safe-area-inset-top));
      padding-bottom: max(16px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 100vh;
    }

    .dashboard {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .dash-main-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .dash-box {
      padding: 12px 8px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 100px;
      position: relative;
    }

    .box-target {
      background: linear-gradient(135deg, var(--keio-pink), #B0005E);
      color: white;
    }

    .box-current {
      background: linear-gradient(135deg, var(--keio-blue), #001A54);
      color: white;
    }

    .dash-label-badge {
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.5px;
      opacity: 0.9;
      margin-bottom: 2px;
    }

    .dash-station-title {
      font-size: 20px;
      font-weight: 900;
      line-height: 1.2;
      margin: 2px 0;
      word-break: break-all;
    }

    .dash-line-sub {
      font-size: 10px;
      opacity: 0.85;
    }

    .btn-change-target {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(255, 255, 255, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.5);
      color: white;
      font-size: 10px;
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 12px;
      cursor: pointer;
    }

    .distance-bar {
      background: var(--card-bg);
      border: 2px solid var(--keio-pink);
      border-radius: 12px;
      padding: 8px 12px;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      font-size: 13px;
      font-weight: bold;
      color: #333;
    }

    .distance-bar b {
      color: var(--keio-pink);
      font-size: 20px;
      font-weight: 900;
    }

    .start-select-card {
      background: var(--card-bg);
      padding: 8px 12px;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      text-align: center;
    }

    .start-select-card label {
      font-size: 10px;
      font-weight: bold;
      color: #666;
    }

    select.station-select {
      width: 100%;
      padding: 5px;
      font-size: 13px;
      font-weight: bold;
      border: 1px solid #CCC;
      border-radius: 8px;
      background: #FFF;
      margin-top: 2px;
      text-align: center;
    }

    .action-card {
      background: var(--card-bg);
      padding: 12px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .dice-display {
      font-size: 32px;
      font-weight: 900;
      color: var(--keio-blue);
      min-height: 44px;
      line-height: 44px;
      margin-bottom: 4px;
    }

    .btn-group {
      display: flex;
      gap: 8px;
    }

    .btn {
      background-color: var(--keio-blue);
      color: white;
      border: none;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 12px;
      width: 100%;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 42, 134, 0.2);
    }

    .btn-pink {
      background-color: var(--keio-pink);
      box-shadow: 0 4px 10px rgba(221, 0, 119, 0.25);
    }

    .btn-secondary {
      background-color: #555;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      width: 45%;
    }

    .btn-danger {
      background-color: #D32F2F;
      box-shadow: 0 4px 10px rgba(211, 47, 47, 0.25);
    }

    .btn-outline {
      background-color: transparent;
      border: 2px solid #666;
      color: #666;
      box-shadow: none;
    }

    .btn:disabled {
      background-color: #CCC;
      box-shadow: none;
    }

    .cards-section {
      background: var(--card-bg);
      padding: 12px;
      border-radius: 16px;
      flex-grow: 1;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .section-title {
      font-size: 12px;
      font-weight: bold;
      color: #555;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }

    .card-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .card-item {
      display: flex;
      flex-direction: column;
      padding: 8px 10px;
      border: 1px solid #E0E0E0;
      border-radius: 10px;
      background: #FAF9F6;
      gap: 4px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-type {
      font-size: 10px;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
      color: white;
    }

    .type-移動 { background-color: #002A86; }
    .type-特殊 { background-color: #DD0077; }

    .card-name {
      font-size: 13px;
      font-weight: bold;
      flex-grow: 1;
      margin-left: 8px;
    }

    .card-desc {
      font-size: 10px;
      color: #666;
      line-height: 1.3;
      background: #EEE;
      padding: 4px 6px;
      border-radius: 4px;
    }

    .btn-use-card {
      background: var(--keio-pink);
      color: white;
      border: none;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: bold;
      border-radius: 6px;
    }

    .btn-use-card:disabled {
      background: #CCC;
      color: #888;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .modal-card {
      background: white;
      width: 100%;
      max-width: 340px;
      border-radius: 16px;
      padding: 18px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      max-height: 85vh;
      overflow-y: auto;
    }

    .modal-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 12px;
      color: var(--keio-blue);
    }

    .event-icon {
      font-size: 38px;
      margin-bottom: 8px;
    }

    .event-msg {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 16px;
      color: #222;
      line-height: 1.4;
    }

    .move-option-btn {
      display: block;
      width: 100%;
      padding: 10px 12px;
      margin: 6px 0;
      border: 2px solid var(--keio-blue);
      border-radius: 10px;
      background: #F0F4FF;
      font-size: 13px;
      font-weight: bold;
      color: #111;
      text-align: left;
    }

    .move-option-btn span.dice-tag {
      display: inline-block;
      background: var(--keio-pink);
      color: white;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      margin-bottom: 2px;
    }

    .move-option-btn span.dist-tag {
      display: inline-block;
      float: right;
      font-size: 11px;
      color: var(--keio-pink);
      font-weight: bold;
    }

    .card-choice-btn {
      display: block;
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 2px solid var(--keio-pink);
      border-radius: 10px;
      background: #FFF0F5;
      text-align: left;
      cursor: pointer;
    }

    .history-list {
      text-align: left;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }

    .history-item {
      background: #F8F9FA;
      border-left: 4px solid var(--keio-blue);
      padding: 8px 10px;
      border-radius: 6px;
    }

    .history-item.card-act {
      border-left-color: var(--keio-pink);
      background: #FFF0F5;
    }

    .history-item.goal-act {
      border-left-color: #FFD700;
      background: #FFFDE7;
      font-weight: bold;
    }

    .history-item .time {
      font-size: 10px;
      color: #888;
      margin-bottom: 2px;
    }

    .log-box {
      background: #222;
      color: #00FF66;
      font-family: monospace;
      font-size: 11px;
      padding: 8px;
      border-radius: 10px;
      height: 75px;
      overflow-y: auto;
    }

    .footer-actions {
      margin-top: 4px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="dashboard">
    <div class="dash-main-grid">
      <div class="dash-box box-current">
        <div class="dash-label-badge">📍 現在地</div>
        <div class="dash-station-title" id="current-name">京王多摩川</div>
        <div class="dash-line-sub" id="current-line">(相模原線)</div>
      </div>

      <div class="dash-box box-target">
        <button class="btn-change-target" id="change-target-btn" style="display:none;" onclick="requestTargetChange()">変更</button>
        <div class="dash-label-badge">🎯 目的地</div>
        <div class="dash-station-title" id="target-name">未定</div>
        <div class="dash-line-sub" id="target-line">---</div>
      </div>
    </div>

    <div class="distance-bar" id="distance-bar">
      目的地を決めます。「スロットで決める」または「自分で選ぶ」を押してください
    </div>

    <div class="start-select-card" id="start-select-container">
      <label for="start-station-select">スタート駅の指定・変更:</label>
      <select id="start-station-select" class="station-select" onchange="changeStartStation()">
      </select>
    </div>
  </div>

  <div class="action-card">
    <div class="dice-display" id="dice-num">🎲</div>
    <div class="btn-group" id="target-btn-group">
      <button class="btn" id="main-btn">スロットで決める</button>
      <button class="btn btn-secondary" id="manual-target-btn" onclick="openManualTargetPicker()">自分で選ぶ</button>
    </div>
  </div>

  <div class="cards-section">
    <div class="section-title">
      <span>手持ちカード</span>
      <span id="card-count">0枚</span>
    </div>
    <div class="card-list" id="card-container"></div>
  </div>

  <div class="log-box" id="log">
    > スタート駅を選び、「スロットで決める」または「自分で選ぶ」を押してください。
  </div>

  <div class="footer-actions">
    <button class="btn btn-danger" onclick="endGameAndShowHistory()">🏁 履歴ログ・結果を見る</button>
    <button class="btn btn-outline" onclick="resetAllDataAndRestart()">🔄 新しく最初から遊ぶ (リセット)</button>
  </div>

  <div id="game-modal" class="modal-overlay hidden" onclick="onModalOverlayClick(event)">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-title" id="modal-title">タイトル</div>
      <div id="modal-content"></div>
    </div>
  </div>

    let currentStation = STATIONS["ST_KEIOTAMAGAWA"];
    let targetStation = null;

    let inventory = [];

    function saveGameState() {
      const dataData = {
        currentStationId: currentStation.id,
        targetStationId: targetStation ? targetStation.id : null,
        gameState: gameState,
        inventory: inventory,
        gameHistory: gameHistory,
        movingTargetStationId: movingTargetStation ? movingTargetStation.id : null
      };
      localStorage.setItem("keio_momotetsu_save", JSON.stringify(dataData));
    }

    function loadGameState() {
      const saved = localStorage.getItem("keio_momotetsu_save");
      if (saved) {
        try {
          const data = JSON.parse(saved);
          if (data.currentStationId && STATIONS[data.currentStationId]) {
            currentStation = STATIONS[data.currentStationId];
          }
          if (data.targetStationId && STATIONS[data.targetStationId]) {
            targetStation = STATIONS[data.targetStationId];
          }
          gameState = data.gameState || "SET_TARGET";
          inventory = data.inventory || [];
          gameHistory = data.gameHistory || [];

          if (gameState === "ROLL_DICE") {
            const mainBtn = document.getElementById("main-btn");
            const manualBtn = document.getElementById("manual-target-btn");
            mainBtn.innerText = "サイコロを振る";
            manualBtn.style.display = "none";
            document.getElementById("start-select-container").style.display = "none";
          }

          if (data.movingTargetStationId && STATIONS[data.movingTargetStationId]) {
            movingTargetStation = STATIONS[data.movingTargetStationId];
            setTimeout(() => {
              showRealMoveModal(movingTargetStation);
            }, 300);
          }

          log("前回のプレイ状態を復元しました。");
        } catch (e) {
          console.error("Save data parse error", e);
        }
      }
    }

    function resetAllDataAndRestart() {
      if (confirm("これまでのプレイデータやカードを削除して、新しく最初から始めますか？")) {
        localStorage.removeItem("keio_momotetsu_save");
        location.reload();

    function addHistory(type, text) {
      const now = new Date();
      const timeStr = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
      gameHistory.push({ type, text, time: timeStr });
      saveGameState();
    }

    function getShortestDistance(startId, targetId) {
      if (!startId || !targetId || startId === targetId) return 0;

      let queue = [{ id: startId, dist: 0 }];
      let visited = new Set([startId]);

      while (queue.length > 0) {
        let curr = queue.shift();
        let st = STATIONS[curr.id];

        for (let nid of st.neighbors) {
          if (nid === targetId) return curr.dist + 1;
          if (!visited.has(nid)) {
            visited.add(nid);
            queue.push({ id: nid, dist: curr.dist + 1 });
          }
        }
      }
      return 0;
    }

    function updateDashboardUI() {
      document.getElementById("current-name").innerText = currentStation.name;

        document.getElementById("target-name").innerText = targetStation.name;
        document.getElementById("target-line").innerText = `(${targetStation.line})`;

        const remaining = getShortestDistance(currentStation.id, targetStation.id);
        document.getElementById("distance-bar").innerHTML = `目的地まであと <b>${remaining}</b> 駅`;
        changeBtn.style.display = "block";
      } else {
        document.getElementById("target-name").innerText = "未定";
        document.getElementById("target-line").innerText = "---";
        document.getElementById("distance-bar").innerHTML = `目的地を決めます。「スロットで決める」または「自分で選ぶ」を押してください`;
        changeBtn.style.display = "none";

    }

    function spinTargetSlot() {
      const btn = document.getElementById("main-btn");
      const manualBtn = document.getElementById("manual-target-btn");
      const selectCard = document.getElementById("start-select-container");
      btn.disabled = true;
      manualBtn.style.display = "none";

      `;

      const keys = Object.keys(STATIONS);

      const interval = setInterval(() => {
        const randKey = keys[Math.floor(Math.random() * keys.length)];
        const randSt = STATIONS[randKey];
        
        document.getElementById("slot-station-name").innerText = `${randSt.name}駅`;
        document.getElementById("slot-line-name").innerText = `(${randSt.line})`;
        count++;

        if (count > 22) {
          clearInterval(interval);
          do {
            const finalKey = keys[Math.floor(Math.random() * keys.length)];
            targetStation = STATIONS[finalKey];
          } while (targetStation.id === currentStation.id);

          const msg = `目的地が【${targetStation.name}（${targetStation.line}）】に決定！`;
          log(`🎯 ${msg}`);
          addHistory("target", msg);

          gameState = "ROLL_DICE";
          btn.innerText = "サイコロを振る";
          btn.disabled = false;

    function getValidStepsForTrain(maxStepsAllowed = [1, 2, 3, 4, 5, 6]) {
      const validSteps = [];
      maxStepsAllowed.forEach(step => {
        const testResults = [];
        searchDestinations(currentStation.id, null, step, testResults);
        if (testResults.length > 0) {
          validSteps.push(step);
        }
      });
      return validSteps;
    }

    function getSingleDiceValue(validSteps) {
      if (!targetStation) {
        return validSteps[Math.floor(Math.random() * validSteps.length)];
      }

      const remDist = getShortestDistance(currentStation.id, targetStation.id);

      if (remDist >= 1 && remDist <= 6 && validSteps.includes(remDist)) {
        if (Math.random() < 0.5) {
          return remDist;
        }
      }

      return validSteps[Math.floor(Math.random() * validSteps.length)];
    }

    function rollDice(diceCount = 1, allowedEyes = null) {
      const btn = document.getElementById("main-btn");
      btn.disabled = true;

      let baseAllowed = allowedEyes ? allowedEyes : [1, 2, 3, 4, 5, 6];
      let validSteps = getValidStepsForTrain(baseAllowed);

      if (validSteps.length === 0) {
        showPopupNotice("移動不可", "現在地から進める駅が周囲にありません。");
        btn.disabled = false;
        return;
      }

      let count = 0;
      const interval = setInterval(() => {
        let total = 0;
        let showArr = [];

        for (let i = 0; i < diceCount; i++) {
          let val = getSingleDiceValue(validSteps);
          total += val;
          showArr.push(val);
        }

        document.getElementById("dice-num").innerText = diceCount > 1 ? showArr.join("+") + ` = ${total}` : total;
        count++;

        if (count > 10) {
          clearInterval(interval);
          log(`🎲 サイコロ (個数:${diceCount}): 出目合計 ${total}`);
          saveGameState();

          setTimeout(() => {
            showMoveOptions(total, diceCount);
          }, 500);
        }
      }, 70);
    }

    function rollChooseDice(diceCount) {
      const btn = document.getElementById("main-btn");
      btn.disabled = true;

      let validSteps = getValidStepsForTrain([1, 2, 3, 4, 5, 6]);

      if (validSteps.length === 0) {
        showPopupNotice("移動不可", "現在地から進める駅がありません。");
        btn.disabled = false;
        return;
      }

      let count = 0;
      let finalResults = [];

      const interval = setInterval(() => {
        finalResults = [];
        for (let i = 0; i < diceCount; i++) {
          finalResults.push(getSingleDiceValue(validSteps));
        }

        document.getElementById("dice-num").innerText = finalResults.map(val => `[${val}]`).join(" ");
        count++;

        if (count > 10) {
          clearInterval(interval);
          log(`🎲 サイコロ${diceCount}個振り選択: 出目 ${finalResults.join(", ")}`);
          saveGameState();

          setTimeout(() => {
            showChooseDiceOptionsModal(finalResults);
          }, 500);
        }
      }, 70);
    }

      const content = document.getElementById("modal-content");

      const uniqueValues = [...new Set(diceValues)].sort((a, b) => a - b);

      content.innerHTML = `<div class="event-msg">出た目から好きな歩数を1つ選んで移動します:</div>`;

      uniqueValues.forEach(val => {
        const btn = document.createElement("button");
        btn.className = "btn";
        btn.style.marginBottom = "8px";
        btn.innerText = `🎲 【 ${val} マス 】進む`;
        btn.onclick = () => {
          document.getElementById("dice-num").innerText = val;
          showMoveOptions(val, 1);
        };
        content.appendChild(btn);
      });

      modal.classList.remove("hidden");

    function showMoveOptions(steps, diceCount = 1) {
      const results = [];
      searchDestinations(currentStation.id, null, steps, results);

      const modal = document.getElementById("game-modal");
      const modalContent = document.getElementById("modal-content");
      document.getElementById("modal-title").innerText = `${steps}駅進むルート選択`;
      modalContent.innerHTML = "";

      if (results.length === 0) {
        modalContent.innerHTML = "<p>この数で移動できる駅がありません。</p>";
        setTimeout(() => {
          modal.classList.add("hidden");
          document.getElementById("main-btn").disabled = false;
        }, 1500);
      } else {
        const uniqueResults = [];
        results.forEach(res => {
          if (!uniqueResults.some(u => u.station.id === res.station.id)) {
            uniqueResults.push(res);
          }
        });

        uniqueResults.forEach(opt => {
          const remDist = targetStation ? getShortestDistance(opt.station.id, targetStation.id) : 0;

          const btn = document.createElement("button");
          btn.className = "move-option-btn";
          btn.innerHTML = `
            ${opt.dirText}
            <span class="dist-tag">あと ${remDist} 駅</span><br>
            <b>${opt.station.name}駅</b> (${opt.station.line})
          `;
          btn.onclick = () => requestRealMoveInstruction(opt.station, steps, diceCount);
          modalContent.appendChild(btn);
        });
      }
      modal.classList.remove("hidden");
    }

    function searchDestinations(currId, fromId, remainingSteps, results) {
      const currSt = STATIONS[currId];

      if (remainingSteps === 0) {
        results.push({ station: currSt, dirText: "➔ 到着駅 (" + currSt.line + ")" });
        return;
      }

      currSt.neighbors.forEach(nid => {
        if (nid === fromId) return;
        searchDestinations(nid, currId, remainingSteps - 1, results);
      });
    }

    function requestRealMoveInstruction(targetSt, steps, diceCount) {
      movingTargetStation = targetSt;
      
      const histText = `🎲 サイコロ${diceCount}個 (${steps}マス移動): 【${currentStation.name}駅】➔ 【${targetSt.name}駅】`;
      addHistory("move", histText);

      showRealMoveModal(targetSt);
    }

    function showRealMoveModal(targetSt) {
      const modal = document.getElementById("game-modal");
      const title = document.getElementById("modal-title");
      const content = document.getElementById("modal-content");

      title.innerText = "🚃 リアル移動指示";
      content.innerHTML = `
        <div class="event-icon">🚶‍♂️💨</div>
        <div class="event-msg">
          <b>【${targetSt.name}駅 (${targetSt.line})】</b> へ移動してください！<br><br>
          <span style="font-size:12px; color:#555;">実際に駅へ移動完了したら「到着しました！」を押してください。</span>
        </div>
        <button class="btn btn-pink" onclick="confirmRealArrival('${targetSt.id}')">到着しました！</button>
      `;

      modal.classList.remove("hidden");
    }

    function confirmRealArrival(targetStId) {
      const targetSt = STATIONS[targetStId];
      movingTargetStation = null;
      selectStation(targetSt);
    }

    function showSpecialCardStationPicker() {
      const modal = document.getElementById("game-modal");
      const title = document.getElementById("modal-title");
      const content = document.getElementById("modal-content");

      title.innerText = "🎴 行きたい駅を選択 (1〜6マス)";
      content.innerHTML = "";

      const allCandidates = [];

      for (let steps = 1; steps <= 6; steps++) {
        const results = [];
        searchDestinations(currentStation.id, null, steps, results);

        results.forEach(res => {
          if (!allCandidates.some(c => c.station.id === res.station.id)) {
            allCandidates.push({ steps, station: res.station, dirText: res.dirText });
          }
        });
      }

      if (allCandidates.length === 0) {
        content.innerHTML = "<p>移動できる駅がありません。</p>";
      } else {
        allCandidates.forEach(item => {
          const remDist = targetStation ? getShortestDistance(item.station.id, targetStation.id) : 0;

          const btn = document.createElement("button");
          btn.className = "move-option-btn";
          btn.innerHTML = `
            <span class="dice-tag">サイコロ ${item.steps}</span>
            <span class="dist-tag">あと ${remDist} 駅</span><br>
            <b>${item.station.name}駅</b> (${item.station.line})
          `;
          btn.onclick = () => {
            document.getElementById("dice-num").innerText = item.steps;
            requestRealMoveInstruction(item.station, item.steps, 1);
          };
          content.appendChild(btn);
        });
      }

      modal.classList.remove("hidden");
    }

    function selectStation(targetSt) {
      document.getElementById("game-modal").classList.add("hidden");
      const prevStName = currentStation.name;
      currentStation = targetSt;
      document.getElementById("start-station-select").value = currentStation.id;

      updateDashboardUI();

      const isGoal = targetStation && (currentStation.id === targetStation.id);

      if (isGoal) {
        const goalLogMsg = `🎉【祝・ミッション達成！】目的地「${currentStation.name}駅」に無事到着しました！`;
        log(`************************************`);
        log(goalLogMsg);
        log(`************************************`);
        
        addHistory("goal", `🎉【目的地到着】「${currentStation.name}駅 (${currentStation.line})」に無事到着しミッションクリア！`);

        showArrivalCheckPopup();
      } else {
        triggerStationEvent(prevStName);
      }
    }

    // ★ 目的地（ゴール）到着時：豪華な「3枚から1枚選べる報酬」ポップアップ
    function showArrivalCheckPopup() {
      const modal = document.getElementById("game-modal");
      const title = document.getElementById("modal-title");
      const content = document.getElementById("modal-content");

      title.innerText = "🎉 ミッション達成！";

      const cardKeys = Object.keys(CARD_DEFINITIONS);
      const candidateKeys = [];
      while (candidateKeys.length < 3) {
        const k = cardKeys[Math.floor(Math.random() * cardKeys.length)];
        if (!candidateKeys.includes(k)) {
          candidateKeys.push(k);
        }
      }

      let optionsHtml = "";
      candidateKeys.forEach(k => {
        const cardDef = CARD_DEFINITIONS[k];
        optionsHtml += `
          <button class="card-choice-btn" onclick="chooseCardFromArrival('${k}')">
            <span class="card-type type-${cardDef.type}">${cardDef.type}</span>
            <b style="font-size:13px; margin-left:4px; color:#111;">${cardDef.name}</b>
            <div style="font-size:10px; color:#555; margin-top:2px;">${cardDef.desc}</div>
          </button>
        `;
      });

      content.innerHTML = `
        <div class="event-icon">🎊</div>
        <div class="event-msg" style="margin-bottom:8px;">
          目的地 <b>【${currentStation.name}駅】</b> に無事到着！<br>
          <b style='color:#00897B;'>ミッションクリア報酬！</b><br>
          好きなカードを1枚選んで獲得できます！
        </div>
        ${optionsHtml}
        <button class="btn btn-pink" style="margin-top:12px;" onclick="resetNextRound()">カードを選ばず次の目的地を決める</button>
      `;

      modal.classList.remove("hidden");
    }

    // ★ 途中駅到着時：50%の確率でランダムカード1枚GET（今まで通り）
    function triggerStationEvent(prevStName) {
      const modal = document.getElementById("game-modal");
      const title = document.getElementById("modal-title");
      const content = document.getElementById("modal-content");

      title.innerText = `移動完了 (現在地: ${currentStation.name})`;

      const getCardSuccess = Math.random() < 0.5;

      if (getCardSuccess) {
        const cardKeys = Object.keys(CARD_DEFINITIONS);
        const drawnKey = cardKeys[Math.floor(Math.random() * cardKeys.length)];
        const cardDef = CARD_DEFINITIONS[drawnKey];

        inventory.push({ id: Date.now(), key: drawnKey, ...cardDef });

        content.innerHTML = `
          <div class="event-icon">🎴</div>
          <div class="event-msg">
            <b>${prevStName}駅</b> から <b>${currentStation.name}駅 (${currentStation.line})</b> へ移動完了！<br><br>
            🎁 カードGET: <b style="color:#002A86; font-size:16px;">「${cardDef.name}」</b><br>
            <span style="font-size:11px; color:#555;">${cardDef.desc}</span>
          </div>
          <button class="btn" onclick="closeModal()">OK</button>
        `;
        log(`【${currentStation.name}駅】移動完了 ➔ カード「${cardDef.name}」を入手！`);
      } else {
        content.innerHTML = `
          <div class="event-icon">🚃</div>
          <div class="event-msg">
            <b>${prevStName}駅</b> から <b>${currentStation.name}駅 (${currentStation.line})</b> へ移動完了！<br><br>
            <span style="color:#666;">（カードは獲得できませんでした）</span>
          </div>
          <button class="btn" onclick="closeModal()">OK</button>
        `;
        log(`【${currentStation.name}駅】移動完了`);
      }

      modal.classList.remove("hidden");
    }

    function chooseCardFromArrival(cardKey) {
      const cardDef = CARD_DEFINITIONS[cardKey];
      inventory.push({ id: Date.now(), key: cardKey, ...cardDef });
      
      log(`【ミッション達成報酬】カード「${cardDef.name}」を選択してGET！`);
      resetNextRound();
    }

    function resetNextRound() {
      document.getElementById("game-modal").classList.add("hidden");
      gameState = "SET_TARGET";
      targetStation = null;
      const btn = document.getElementById("main-btn");
      const manualBtn = document.getElementById("manual-target-btn");
      btn.innerText = "スロットで決める";
      manualBtn.style.display = "inline-block";
      btn.disabled = false;
      document.getElementById("start-select-container").style.display = "block";
      updateDashboardUI();
    }

    function closeModal() {
      document.getElementById("game-modal").classList.add("hidden");
      document.getElementById("main-btn").disabled = false;
      renderCards();
    }

    function renderCards() {
      const container = document.getElementById("card-container");
      document.getElementById("card-count").innerText = `${inventory.length}枚`;
      container.innerHTML = "";

      inventory.forEach((card, index) => {
        const item = document.createElement("div");
        item.className = "card-item";

        let isUsable = gameState === "ROLL_DICE";
        let statusText = "使う";

        if (card.key === "trade_card" && inventory.length < 4) {
          isUsable = false;
          statusText = "枚数不足";
        }

        item.innerHTML = `
          <div class="card-header">
            <span class="card-type type-${card.type}">${card.type}</span>
            <span class="card-name">${card.name}</span>
            <button class="btn-use-card" ${isUsable ? "" : "disabled"} onclick="useCard(${index})">${statusText}</button>
          </div>
          <div class="card-desc">${card.desc}</div>
        `;
        container.appendChild(item);
      });
      saveGameState();
    }

    function useCard(index) {
      const card = inventory[index];
      log(`🎴 カード【${card.name}】を使用！`);
      
      inventory.splice(index, 1);
      renderCards();

      if (card.key === "special") {
        addHistory("card", `🎴 カード使用: 【スペシャルカード】`);
        showSpecialCardStationPicker();
      } else if (card.key === "change_target") {
        addHistory("card", `🎴 カード使用: 【目的地変更カード】`);
        spinTargetSlot();
      } else if (card.key === "jump_near") {
        const fromStName = currentStation.name;
        const targetNeighborId = targetStation.neighbors[0] ? targetStation.neighbors[0] : targetStation.id;
        const jumpSt = STATIONS[targetNeighborId];
        addHistory("card", `🎴 カード使用: 【目的地近くにジャンプ】 (${fromStName} ➔ ${jumpSt.name})`);
        showJumpPopup(fromStName, jumpSt);
      } else if (card.key === "warp_any") {
        const keys = Object.keys(STATIONS);
        const randKey = keys[Math.floor(Math.random() * keys.length)];
        const warpSt = STATIONS[randKey];
        addHistory("card", `🎴 カード使用: 【どこでもワープカード】 (${currentStation.name} ➔ ${warpSt.name})`);
        showWarpAnyPopup(currentStation.name, warpSt);
      } else if (card.key === "trade_card") {
        inventory.sort(() => Math.random() - 0.5);
        inventory.splice(0, 3);
        
        const cardKeys = Object.keys(CARD_DEFINITIONS);
        const drawnKey = cardKeys[Math.floor(Math.random() * cardKeys.length)];
        const cardDef = CARD_DEFINITIONS[drawnKey];
        inventory.push({ id: Date.now(), key: drawnKey, ...cardDef });

        addHistory("card", `🎴 カード使用: 【カード交換カード】 (新獲得: ${cardDef.name})`);
        renderCards();
        showPopupNotice("🎴 カード交換完了", `手持ちカード3枚を廃棄し、新しく<b>「${cardDef.name}」</b>を獲得しました！`);
      } else if (card.key === "jump_target") {
        addHistory("card", `🎴 カード使用: 【目的地にジャンプ】 (${currentStation.name} ➔ ${targetStation.name})`);
        selectStation(targetStation);
      } else if (card.key === "choose_dice2") {
        addHistory("card", `🎴 カード使用: 【サイコロ2個から選べる】`);
        rollChooseDice(2);
      } else if (card.key === "choose_dice3") {
        addHistory("card", `🎴 カード使用: 【サイコロ3個から選べる】`);
        rollChooseDice(3);
      } else if (card.key === "dice2") {
        addHistory("card", `🎴 カード使用: 【2個振りカード】`);
        rollDice(2);
      } else if (card.key === "dice3") {
        addHistory("card", `🎴 カード使用: 【3個振りカード】`);
        rollDice(3);
      } else if (card.key === "big_eye") {
        addHistory("card", `🎴 カード使用: 【大目カード】`);
        rollDice(1, [4, 5, 6]);
      } else if (card.key === "small_eye") {
        addHistory("card", `🎴 カード使用: 【小目カード】`);
        rollDice(1, [1, 2, 3]);
      }
    }

    function showJumpPopup(fromStName, jumpSt) {
      const modal = document.getElementById("game-modal");
      const title = document.getElementById("modal-title");
      const content = document.getElementById("modal-content");

      title.innerText = "🚀 近くにジャンプ！";
      content.innerHTML = `
        <div class="event-icon">⚡</div>
        <div class="event-msg">
          <b>【${fromStName}駅】</b> から ワープ！<br><br>
          目的地【${targetStation.name}】のすぐ手前、<br>
          <b style="color:#DD0077; font-size:18px;">【${jumpSt.name}駅 (${jumpSt.line})】</b> へ移動しました！
        </div>
        <button class="btn" onclick="executeJump('${jumpSt.id}')">OK</button>
      `;
      modal.classList.remove("hidden");
    }

    function showWarpAnyPopup(fromStName, warpSt) {
      const modal = document.getElementById("game-modal");
      const title = document.getElementById("modal-title");
      const content = document.getElementById("modal-content");

      title.innerText = "🌀 どこでもワープ！";
      content.innerHTML = `
        <div class="event-icon">🌌</div>
        <div class="event-msg">
          <b>【${fromStName}駅】</b> から ワープ！<br><br>
          全駅の中からランダム選出された<br>
          <b style="color:#002A86; font-size:18px;">【${warpSt.name}駅 (${warpSt.line})】</b> へ移動しました！
        </div>
        <button class="btn" onclick="executeJump('${warpSt.id}')">OK</button>
      `;
      modal.classList.remove("hidden");
    }

    function executeJump(targetId) {
      document.getElementById("game-modal").classList.add("hidden");
      currentStation = STATIONS[targetId];
      document.getElementById("start-station-select").value = currentStation.id;
      log(`ワープ完了: 【${currentStation.name}駅】へ移動。`);
      updateDashboardUI();
      renderCards();
      document.getElementById("main-btn").disabled = false;
    }

    function showPopupNotice(titleText, msgHtml) {
      const modal = document.getElementById("game-modal");
      document.getElementById("modal-title").innerText = titleText;
      document.getElementById("modal-content").innerHTML = `
        <div class="event-msg">${msgHtml}</div>
        <button class="btn" onclick="closeModal()">OK</button>
      `;
      modal.classList.remove("hidden");
    }

    function endGameAndShowHistory() {
      const modal = document.getElementById("game-modal");
      const title = document.getElementById("modal-title");
      const content = document.getElementById("modal-content");

      title.innerText = "🏁 プレイリザルト・行動履歴";

      if (gameHistory.length === 0) {
        content.innerHTML = `
          <div class="event-msg">まだプレイ履歴がありません。</div>
          <button class="btn" onclick="closeModal()">閉じる</button>
        `;
      } else {
        let historyHtml = '<div class="history-list">';
        gameHistory.forEach(item => {
          let itemClass = '';
          if (item.type === 'card') itemClass = 'card-act';
          if (item.type === 'goal') itemClass = 'goal-act';

          historyHtml += `
            <div class="history-item ${itemClass}">
              <div class="time">${item.time}</div>
              <div>${item.text}</div>
            </div>
          `;
        });
        historyHtml += '</div>';

        content.innerHTML = `
          <div class="history-list-container">
            <div style="font-size:12px; font-weight:bold; margin-bottom:8px; color:#555;">これまでの移動・カード使用ログ:</div>
            ${historyHtml}
          </div>
          <button class="btn" onclick="closeModal()">閉じる</button>
        `;
      }

      modal.classList.remove("hidden");
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pyramid Number Game - Sequential</title>
    <style>
        :root {
            --p1-color: #ff4d4d;
            --p2-color: #4d79ff;
            --bg-color: #f0f2f5;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            overflow: hidden;
            touch-action: manipulation;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }

        #header {
            padding: 15px 10px;
            text-align: center;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        /* 各プレイヤーの次に出す数字カード */
        .next-card {
            background: white;
            padding: 10px 15px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 80px;
            transition: all 0.3s;
            border: 3px solid transparent;
        }

        .next-card.active {
            transform: scale(1.1);
            border-color: #333;
        }

        .card-label { font-size: 0.7rem; color: #666; display: block; margin-bottom: 2px;}
        .card-num { font-size: 1.8rem; font-weight: bold; }

        /* ターン交代ポップアップ */
        #turn-popup {
            position: fixed;
            top: 40%; left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            padding: 15px 35px;
            border-radius: 50px;
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #turn-popup.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

        #game-board {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .row { display: flex; justify-content: center; margin-bottom: 4px; }

        .circle {
            width: 46px; height: 46px;
            border: 2px solid #ccc;
            border-radius: 50%;
            margin: 3px;
            display: flex; justify-content: center; align-items: center;
            font-size: 1.3rem; font-weight: bold;
            background-color: white;
            transition: transform 0.1s;
        }

        .circle.last-one {
            border: 4px solid #ffcc00;
            background-color: #fffde6;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .circle.highlight { box-shadow: 0 0 15px #ffcc00; z-index: 10; }

        #settings {
            padding: 15px; width: 100%; text-align: center;
            background: white; border-radius: 20px 20px 0 0;
        }

        .mode-toggle {
            display: inline-flex; align-items: center; gap: 8px;
            font-size: 0.9rem; background: #eee; padding: 8px 16px; border-radius: 30px;
        }

        #result-modal {
            display: none; position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: white; padding: 30px; border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            z-index: 300; text-align: center; width: 85%;
        }
        #overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); z-index: 299;
        }
        .reset-btn {
            background: #333; color: white; border: none;
            padding: 12px 30px; border-radius: 10px; font-size: 1.1rem; margin-top: 20px;
        }
    </style>
</head>
<body>

    <div id="turn-popup"></div>

    <div id="header">
        <div id="card-p1" class="next-card active">
            <span class="card-label">赤の次</span>
            <span id="num-p1" class="card-num" style="color: var(--p1-color)">1</span>
        </div>
        <div id="card-p2" class="next-card">
            <span class="card-label">青の次</span>
            <span id="num-p2" class="card-num" style="color: var(--p2-color)">1</span>
        </div>
    </div>

    <div id="game-board"></div>

    <div id="settings">
        <label class="mode-toggle">
            <input type="checkbox" id="cpu-mode"> CPUと対戦する
        </label>
    </div>

    <div id="overlay"></div>
    <div id="result-modal">
        <h2 id="winner-text"></h2>
        <p id="score-details" style="font-size: 1.5rem; font-weight: bold;"></p>
        <button class="reset-btn" onclick="initGame()">もう一度遊ぶ</button>
    </div>

    <script>
        let currentPlayer = 1; 
        let p1Next = 1;
        let p2Next = 1;
        let gameState = [];
        const rows = 6;
        let isGameOver = false;
        let isProcessing = false;

        function initGame() {
            isGameOver = false;
            isProcessing = false;
            currentPlayer = 1;
            p1Next = 1;
            p2Next = 1;
            gameState = [];
            document.getElementById('game-board').innerHTML = '';
            document.getElementById('result-modal').style.display = 'none';
            document.getElementById('overlay').style.display = 'none';
            updateUI();

            for (let i = 0; i < rows; i++) {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'row';
                for (let j = 0; j <= i; j++) {
                    const circle = document.createElement('div');
                    circle.className = 'circle';
                    circle.dataset.row = i;
                    circle.dataset.col = j;
                    circle.onclick = () => handleCircleClick(i, j);
                    rowDiv.appendChild(circle);
                    gameState.push({ row: i, col: j, value: null, player: null });
                }
                document.getElementById('game-board').appendChild(rowDiv);
            }
        }

        function handleCircleClick(row, col) {
            if (isGameOver || isProcessing) return;
            const cell = gameState.find(c => c.row === row && c.col === col);
            if (cell.value !== null) return;

            executeMove(cell);
        }

        function executeMove(cell) {
            const currentNum = (currentPlayer === 1) ? p1Next : p2Next;
            
            cell.value = currentNum;
            cell.player = currentPlayer;
            
            const el = document.querySelector(`[data-row="${cell.row}"][data-col="${cell.col}"]`);
            el.textContent = currentNum;
            el.style.color = 'white';
            const color = (currentPlayer === 1) ? 'var(--p1-color)' : 'var(--p2-color)';
            el.style.backgroundColor = color;
            el.style.borderColor = color;

            // 個別の数値をカウントアップ
            if (currentPlayer === 1) {
                p1Next = p1Next >= 10 ? 1 : p1Next + 1;
            } else {
                p2Next = p2Next >= 10 ? 1 : p2Next + 1;
            }
            
            if (checkGameOver()) return;

            // 交代
            currentPlayer = currentPlayer === 1 ? 2 : 1;
            showTurnPopup();
            updateUI();

            if (document.getElementById('cpu-mode').checked && currentPlayer === 2) {
                isProcessing = true;
                setTimeout(cpuTurn, 1000);
            }
        }

        function showTurnPopup() {
            const popup = document.getElementById('turn-popup');
            const name = currentPlayer === 1 ? "赤" : "青";
            popup.textContent = `${name}の番です`;
            popup.style.backgroundColor = currentPlayer === 1 ? 'var(--p1-color)' : 'var(--p2-color)';
            popup.classList.add('show');
            setTimeout(() => popup.classList.remove('show'), 600);
        }

        function updateUI() {
            document.getElementById('num-p1').textContent = p1Next;
            document.getElementById('num-p2').textContent = p2Next;
            
            document.getElementById('card-p1').classList.toggle('active', currentPlayer === 1);
            document.getElementById('card-p2').classList.toggle('active', currentPlayer === 2);
        }

        function cpuTurn() {
            const emptyCells = gameState.filter(c => c.value === null);
            if (emptyCells.length <= 1) return;
            const randomCell = emptyCells[Math.floor(Math.random() * emptyCells.length)];
            isProcessing = false;
            executeMove(randomCell);
        }

        function checkGameOver() {
            const emptyCells = gameState.filter(c => c.value === null);
            if (emptyCells.length === 1) {
                isGameOver = true;
                calculateResult(emptyCells[0]);
                return true;
            }
            return false;
        }

        function calculateResult(lastCell) {
            const lastEl = document.querySelector(`[data-row="${lastCell.row}"][data-col="${lastCell.col}"]`);
            lastEl.classList.add('last-one');

            const neighbors = [
                {r: lastCell.row, c: lastCell.col - 1}, {r: lastCell.row, c: lastCell.col + 1},
                {r: lastCell.row - 1, c: lastCell.col - 1}, {r: lastCell.row - 1, c: lastCell.col},
                {r: lastCell.row + 1, c: lastCell.col}, {r: lastCell.row + 1, c: lastCell.col + 1}
            ];

            let p1Score = 0, p2Score = 0;
            neighbors.forEach(n => {
                const cell = gameState.find(c => c.row === n.r && c.col === n.c);
                if (cell && cell.value !== null) {
                    document.querySelector(`[data-row="${n.r}"][data-col="${n.c}"]`).classList.add('highlight');
                    if (cell.player === 1) p1Score += cell.value;
                    else p2Score += cell.value;
                }
            });

            setTimeout(() => {
                let msg = p1Score > p2Score ? "赤の勝ち！" : (p2Score > p1Score ? "青の勝ち！" : "引き分け！");
                document.getElementById('winner-text').textContent = msg;
                document.getElementById('score-details').innerHTML = 
                    `<span style="color:var(--p1-color)">赤: ${p1Score}</span> - <span style="color:var(--p2-color)">青: ${p2Score}</span>`;
                document.getElementById('result-modal').style.display = 'block';
                document.getElementById('overlay').style.display = 'block';
            }, 1000);
        }

        initGame();
    </script>
</body>
</html>
